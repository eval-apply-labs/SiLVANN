# Windows' libraries, prebuilt: the evaluator for each Python install.ps1 accepts, and the silicon families, built on
# GitHub's Windows runners from this tree with scripts/build.py — the commands a PC builds them with — and attached to the
# release a tag names, as silvann_windows_libraries_update_x64.zip — named for what it is, the libraries install.ps1 fetches at an
# install or an update, and not the app's download, which is silvann_portable_x64.zip (⚖ 2026-11-23; `silvann_windows_x64.zip`
# up to 1.6.0). install.ps1 takes them when their stamp is its own folder's (the
# engine's tree and scripts/build.py, by git's hash); otherwise it builds them, as scripts/build.ps1 does.
#
# The same run makes the portable app, silvann_portable_x64.zip (NN-162, NN-194): Windows' part here (`portable`), Linux's
# in a manylinux container (`linux_portable`), joined into one folder — windows/, linux/, data/ — that a USB drive carries
# between the two systems (`portable_app`).
#
# The runners have no GPU: each library is built and loaded, no model is run. Windows Server 2022's runner, for its
# Visual Studio 2022: CUDA 12.9's front end does not take Visual Studio 2026's headers (cudafe++ crashed on them),
# and a library built with the older toolset runs on an older Visual C++ runtime. NVIDIA's family is built with CUDA 12.9
# for every card the family lists, so any driver of CUDA 12's line or newer runs it. The zip holds binaries: its
# NOTICES.md says which, and each one's licence (ATTRIBUTION.md §7). The actions are pinned to their release commits,
# because the job can write to the repository's releases.
#
# A release candidate's branch (rc/*) builds and checks everything, unsigned, its zips the run's artifacts. A release's
# tag builds the same and attaches the zips to its release: a `n*` tag's unsigned, as an rc's are (and the `v*` tags'
# before them), and only a `rel*` tag's signed — ⚖ 2026-11-11 *"i dont think we can afford a trial signature im afraid"*
# · *"i'd do it as rel and n"*, every signature paid for. A `rel*` tag, once every build has passed, signs what runs on a
# PC with Eval-Apply's certificate before
# anything is zipped (`sign`) — only the files that changed since the last signed release: the rest are that release's
# signed files, taken from its zips (scripts/sign_plan.py, `signed_manifest.json` on each release). SSL.com's eSigner
# signs; its account's secrets are the `signing` environment's — ES_USERNAME, ES_PASSWORD, ES_CREDENTIAL_ID,
# ES_TOTP_SECRET — and a `rel*` tag without them stops there when anything is to be signed, so a signed release's Windows
# zips are signed or not made.
name: "windows: libraries"
on:
  push:
    tags: ["v*", "n*", "rel*"]
    branches: ["rc/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-libraries-${{ github.ref }}
  cancel-in-progress: true

env:
  CUDA_VERSION: "12.9.1"
  CUDA_SHORT: "12.9"
  # AMD's compiler for Windows, which builds amd_rocm10 there: the HIP SDK's installer (ROCm 7.2, the compiler line the
  #   family is measured with on Linux), and ROCm's own archive for the Radeon RX 9000s where that will not install
  HIP_SDK_INSTALLER: "AMD-Software-PRO-Edition-26.Q3-Win11-For-HIP.exe"
  ROCM_ARCHIVE: "therock-dist-windows-gfx120X-all-10.2.0.tar.gz"
  PYTHONUTF8: "1"

jobs:
  evaluator:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: The evaluator, for Python ${{ matrix.python }}
        shell: pwsh
        env:
          SILVANN_SILICON_FAMILIES: none
        run: |
          python -m pip install --quiet -r scripts/requirements.txt
          python scripts/build.py
          if ($LASTEXITCODE -ne 0) { Get-Content lib\evaluator.log -ErrorAction SilentlyContinue; exit 1 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evaluator-${{ matrix.python }}
          # its unit key beside it (scripts/unit_key.py): sign_plan.py's, and in no zip — the zips take *.pyd and *.dll
          path: |
            lib/silvann_engine_cpu*.pyd
            lib/silvann_engine_cpu*.pyd.unit
          if-no-files-found: error

  families:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: CUDA's compiler and runtime
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "cuda.exe"
          curl.exe -fsSL -o $exe "https://developer.download.nvidia.com/compute/cuda/$env:CUDA_VERSION/network_installers/cuda_${env:CUDA_VERSION}_windows_network.exe"
          $parts = @("nvcc", "cudart") | ForEach-Object { "$($_)_$env:CUDA_SHORT" }   # 12.9 carries crt and nvvm in nvcc
          $p = Start-Process -FilePath $exe -ArgumentList (@("-s") + $parts) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "CUDA's installer stopped: exit $($p.ExitCode)" }
          $root = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v$env:CUDA_SHORT"
          if (-not (Test-Path "$root\bin\nvcc.exe")) { Get-ChildItem $root -ErrorAction SilentlyContinue; throw "no nvcc in $root" }
          & "$root\bin\nvcc.exe" --version
          "SILVANN_NVCC=$root\bin\nvcc.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "CUDA_ROOT=$root" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      # ⛳ AMD's COMPILER IS TRIED, NEVER REQUIRED: amd_rocm10 on Windows has run on no card, and a run that cannot fetch
      #   or install AMD's compiler still builds every other library — the step says which of the two it took, or that
      #   it took none. ① The HIP SDK's installer, unattended as AMD documents it (`-install -log <file>`): it is a
      #   window's program even so, and made for Windows 11, so it is given fifteen minutes on this runner. ② ROCm's own
      #   archive: its compiler, HIP's headers and import library, nothing of its math libraries. Neither needs a card.
      - name: AMD's compiler, for the ROCm family
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          function Rooted($root) {
            (Test-Path "$root\include\hip\hip_runtime.h") -and (Test-Path "$root\lib\amdhip64.lib") -and
              ((Test-Path "$root\bin\clang++.exe") -or (Test-Path "$root\lib\llvm\bin\clang++.exe"))
          }
          $root = $null; $from = $null
          $exe = Join-Path $env:RUNNER_TEMP "hip_sdk.exe"
          curl.exe -fsSL -e "https://www.amd.com/" -o $exe "https://download.amd.com/developer/eula/rocm-hub/$env:HIP_SDK_INSTALLER"
          if ($LASTEXITCODE -eq 0) {
            $log = Join-Path $env:RUNNER_TEMP "hip_sdk_install.log"
            # in a job, so the wait is for the installer and every program it starts, and has an end
            $job = Start-Job -ArgumentList $exe, $log -ScriptBlock { param($exe, $log)
              (Start-Process -FilePath $exe -ArgumentList @("-install", "-log", $log) -Wait -PassThru).ExitCode }
            if (Wait-Job $job -Timeout 900) { "the HIP SDK's installer: exit $(Receive-Job $job)" }
            else { "the HIP SDK's installer had not ended after 15 minutes: stopped"; Stop-Job $job; taskkill.exe /F /T /IM hip_sdk.exe 2>&1 | Out-Null }
            if (Test-Path $log) { Get-Content $log -Tail 20 }
            $root = Get-ChildItem "C:\Program Files\AMD\ROCm" -Directory -ErrorAction SilentlyContinue |
              Where-Object { Rooted $_.FullName } | Sort-Object Name | Select-Object -Last 1 | ForEach-Object { $_.FullName }
            if ($root) { $from = "the HIP SDK, $env:HIP_SDK_INSTALLER" } else { "no ROCm under C:\Program Files\AMD after it" }
          } else { "the HIP SDK's installer was not fetched (curl $LASTEXITCODE)" }
          if (-not $root) {
            $tar = Join-Path $env:RUNNER_TEMP "rocm.tar.gz"; $to = Join-Path $env:RUNNER_TEMP "rocm"
            curl.exe -fsSL -o $tar "https://stable.repo.amd.com/rocm/core/tarball/$env:ROCM_ARCHIVE"
            if ($LASTEXITCODE -eq 0) {
              New-Item -ItemType Directory -Force $to | Out-Null
              tar.exe -xzf $tar -C $to ./.info ./include ./lib/llvm ./lib/amdhip64.lib ./share/doc/hip ./share/doc/hipcc
              "ROCm's archive: tar exit $LASTEXITCODE"
              if (Rooted $to) { $root = $to; $from = "ROCm's archive, $env:ROCM_ARCHIVE" }
            } else { "ROCm's archive was not fetched (curl $LASTEXITCODE)" }
          }
          if (-not $root) { "::warning::no AMD compiler on this runner: amd_rocm10 is not built for Windows in this run"; exit 0 }
          $clang = if (Test-Path "$root\bin\clang++.exe") { "$root\bin\clang++.exe" } else { "$root\lib\llvm\bin\clang++.exe" }
          & $clang --version
          $v = @("MAJOR", "MINOR", "PATCH") | ForEach-Object {
            (Select-String -Path "$root\include\hip\hip_version.h" -Pattern "#define\s+HIP_VERSION_$_\s+(\d+)").Matches[0].Groups[1].Value }
          $said = "HIP $($v -join '.'), from $from"
          $said
          "SILVANN_HIP_ROOT=$root" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "SILVANN_AMD_CLANG=$clang" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "HIP_SAID=$said" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: The families
        shell: pwsh
        env:
          SILVANN_SILICON_FAMILIES: x86_avx2 nvidia_cuda12 khronos_opencl2 intel_opencl2 nvidia_opencl1 intel_opencl1_igpu
        run: |
          if ($env:SILVANN_HIP_ROOT) { $env:SILVANN_SILICON_FAMILIES = "$env:SILVANN_SILICON_FAMILIES amd_rocm10" }
          python -m pip install --quiet -r scripts/requirements.txt
          python scripts/build.py
          $built = Get-ChildItem lib\silicon_families -Filter "libsilvann_*.dll" | ForEach-Object { $_.Name }
          $missing = $env:SILVANN_SILICON_FAMILIES.Split(" ") | Where-Object { $built -notcontains "libsilvann_$_.dll" }
          if ($missing -contains "amd_rocm10") {       # said, and the run goes on without it (▶ the step above)
            "::warning::amd_rocm10 did not build for Windows in this run: its log's end follows"
            Get-Content lib\silicon_families\amd_rocm10.log -Tail 60 -ErrorAction SilentlyContinue
            $missing = $missing | Where-Object { $_ -ne "amd_rocm10" }
          }
          if ($missing) {
            Get-ChildItem lib\silicon_families -Filter "*.log" | ForEach-Object { "== $($_.Name)"; Get-Content $_.FullName -Tail 40 }
            throw "not built: $missing"
          }
          New-Item -ItemType Directory -Force notices | Out-Null
          # CUDA's licence: in its folder when the installer put it there, else from the installer itself (a 7-Zip archive)
          $eula = Get-ChildItem $env:CUDA_ROOT -Recurse -Filter "EULA.txt" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $eula) {
            7z e (Join-Path $env:RUNNER_TEMP "cuda.exe") EULA.txt -r "-o$env:RUNNER_TEMP\eula" -y | Out-Null
            $eula = Get-ChildItem "$env:RUNNER_TEMP\eula" -Filter "EULA.txt" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $eula) { throw "no EULA.txt in CUDA's folder or its installer" }
          Copy-Item $eula.FullName notices\CUDA_EULA.txt
          (& $env:SILVANN_NVCC --version | Select-Object -Last 2) | Out-File -Encoding utf8 notices\CUDA_VERSION.txt
          # AMD's: which HIP the family was built against — the signing plan keys the file by this line — and HIP's licence
          if (Test-Path lib\silicon_families\libsilvann_amd_rocm10.dll) {
            $env:HIP_SAID | Out-File -Encoding utf8 notices\HIP_VERSION.txt
            (& $env:SILVANN_AMD_CLANG --version | Select-Object -First 2) | Out-File -Append -Encoding utf8 notices\HIP_VERSION.txt
            $licence = Get-ChildItem "$env:SILVANN_HIP_ROOT\share\doc\hip" -Filter "LICENSE*" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($licence) { Copy-Item $licence.FullName notices\HIP_LICENSE.txt }
            else { Copy-Item scripts\third_party\HIP\LICENSE.md notices\HIP_LICENSE.txt }   # the SDK's folder holds none: ROCm 7.2.4's own, carried
          }
          python -c "import importlib.metadata as m, shutil; d = m.distribution('pybind11'); f = [p for p in d.files if p.name.upper().startswith('LICENSE')][0]; shutil.copy(d.locate_file(f), r'notices\PYBIND11_LICENSE.txt')"
      - name: SiLVANN.exe, the portable app's launcher, signed with the libraries
        shell: pwsh
        run: pwsh scripts/portable/build_launcher.ps1 -Exe lib/SiLVANN.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: families
          path: |
            lib/silicon_families/libsilvann_*.dll
            lib/silicon_families/libsilvann_*.dll.unit
            lib/SiLVANN.exe
            lib/SiLVANN.exe.unit
            notices/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: families-logs
          path: lib/**/*.log

  # Eval-Apply's certificate, on a release's tag alone and after every build above passed. Only what changed is signed:
  #   scripts/sign_plan.py keys each file by what it is built from — its includes, the build script's recipe, and its
  #   unit, the build's preprocessed text of this tree (NN-195) — and a file a key of which is the last signed release's
  #   is taken from that release's zips, its bytes checked against that release's manifest. `plan` above says the same on
  #   every run, so a release candidate's plan is read before a tag signs by it. The rest go through SSL.com's
  #   CodeSignTool — its release's zip, checked by its hash — in one batch on one TOTP, each scanned for malware first
  #   where the account's malware blocker is on (get_scan_settings). CodeSignTool takes a DLL by its
  #   name, so an evaluator (a .pyd, which is a DLL) is signed as .dll and named back: Authenticode's signature covers the
  #   file's bytes, not its name. The files keep the layout they were built in, as one artifact, `signed`, with the
  #   release's own `signed_manifest.json`.
  # what a `rel*` tag of this tree would sign, on every run — a release candidate's branch too, where nothing is signed —
  #   so the plan is read before a tag spends a signature by it (NN-195): each file "sign", or "reuse" and by which key,
  #   its includes or its unit (scripts/sign_plan.py)
  plan:
    needs: [evaluator, families]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: built
      - name: What a release of this tree signs, against the last signed release
        run: |
          here="${GITHUB_REF#refs/tags/}"
          prev=-
          mkdir -p "$RUNNER_TEMP/prev"
          for t in $(gh release list --limit 30 --json tagName --jq '.[].tagName'); do
            [ "$t" = "$here" ] && continue
            if gh release download "$t" --pattern signed_manifest.json --dir "$RUNNER_TEMP/prev" 2> /dev/null; then
              prev="$RUNNER_TEMP/prev/signed_manifest.json"
              echo "the last signed release: $t"
              # its build.py, so an edit of this one that runs no other line re-signs nothing (▶ sign_plan.py)
              curl -fsSL -o "$RUNNER_TEMP/prev/build.py" "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$t/scripts/build.py" \
                || rm -f "$RUNNER_TEMP/prev/build.py"
              break
            fi
          done
          python3 -m pip install --quiet pybind11                    # the dry runs' import (▶ sign_plan.py)
          python3 scripts/sign_plan.py plan built "$prev" "$RUNNER_TEMP/plan.json" \
            $( [ -f "$RUNNER_TEMP/prev/build.py" ] && echo --previous-build "$RUNNER_TEMP/prev/build.py" )

  sign:
    needs: [evaluator, families]
    if: startsWith(github.ref, 'refs/tags/rel')
    runs-on: ubuntu-latest
    environment: signing
    env:
      CODESIGNTOOL_URL: "https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.2/CodeSignTool-v1.3.2.zip"
      CODESIGNTOOL_SHA256: "f14b1e1ef14bfa1fd00279c363aab0debbf5dcfba0e4bcdce5d22bb771de0e3a"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: built
      - name: What is signed, and what the last signed release already holds
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          prev=-
          mkdir -p "$RUNNER_TEMP/prev"
          for t in $(gh release list --limit 30 --json tagName --jq '.[].tagName'); do
            [ "$t" = "$tag" ] && continue
            if gh release download "$t" --pattern signed_manifest.json --dir "$RUNNER_TEMP/prev" 2> /dev/null; then
              prev="$RUNNER_TEMP/prev/signed_manifest.json"
              echo "the last signed release: $t"
              # its build.py, so an edit of this one that runs no other line re-signs nothing (▶ sign_plan.py)
              curl -fsSL -o "$RUNNER_TEMP/prev/build.py" "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$t/scripts/build.py" \
                || rm -f "$RUNNER_TEMP/prev/build.py"
              break
            fi
          done
          python3 -m pip install --quiet pybind11                    # the dry runs' import (▶ sign_plan.py)
          python3 scripts/sign_plan.py plan built "$prev" "$RUNNER_TEMP/plan.json" \
            $( [ -f "$RUNNER_TEMP/prev/build.py" ] && echo --previous-build "$RUNNER_TEMP/prev/build.py" )
          if grep -q '"action": "reuse"' "$RUNNER_TEMP/plan.json"; then
            t=$(python3 -c "import json, sys; print(json.load(open(sys.argv[1]))['previous'])" "$RUNNER_TEMP/plan.json")
            gh release download "$t" --pattern 'silvann_windows*_x64.zip' --pattern 'silvann_portable*_x64.zip' \
              --dir "$RUNNER_TEMP/prev"
            python3 scripts/sign_plan.py reuse built "$RUNNER_TEMP/plan.json" "$RUNNER_TEMP/prev"
          fi
          python3 -c "import json, sys; f = json.load(open(sys.argv[1]))['files']; print(''.join(k + '\n' for k, v in sorted(f.items()) if v['action'] == 'sign'), end='')" \
            "$RUNNER_TEMP/plan.json" > "$RUNNER_TEMP/to_sign.txt"
          echo "TO_SIGN=$(wc -l < "$RUNNER_TEMP/to_sign.txt")" >> "$GITHUB_ENV"
      - name: CodeSignTool
        if: env.TO_SIGN != '0'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cst.zip" "$CODESIGNTOOL_URL"
          echo "$CODESIGNTOOL_SHA256  $RUNNER_TEMP/cst.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/cst.zip" -d "$RUNNER_TEMP/cst"
          ls "$RUNNER_TEMP"/cst/jar/code_sign_tool-*.jar
      # the account answers for its credential before anything is signed: a wrong username, password or credential id
      #   stops the run here, where no signature is spent (credential_info signs nothing). The TOTP secret is only read by
      #   the signing itself.
      - name: The signing account answers
        if: env.TO_SIGN != '0'
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          for v in ES_USERNAME ES_PASSWORD ES_CREDENTIAL_ID ES_TOTP_SECRET; do
            [ -n "${!v}" ] || { echo "::error::$v is not among the signing environment's secrets"; exit 1; }
          done
          java="${JAVA_HOME_17_X64:-$JAVA_HOME}/bin/java"
          info=$(cd "$RUNNER_TEMP/cst" && CODE_SIGN_TOOL_PATH="$RUNNER_TEMP/cst" "$java" -jar jar/code_sign_tool-*.jar \
            credential_info -credential_id="$ES_CREDENTIAL_ID" -username="$ES_USERNAME" -password="$ES_PASSWORD" 2>&1) || true
          if ! grep -q "Certificate Expiry" <<< "$info"; then
            echo "::error::the signing account did not answer for its credential:"
            head -5 <<< "$info"   # Actions masks the secrets' values in its log
            exit 1
          fi
          grep -E "Subject DN|Certificate Expiry" <<< "$info"
      - name: Signed
        if: env.TO_SIGN != '0'
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          in="$RUNNER_TEMP/unsigned"; out="$RUNNER_TEMP/signed"
          mkdir -p "$in" "$out"
          # each file the plan signs, under a name of its own, and where it came from
          declare -A from
          while read -r fid; do
            f="built/$fid"
            n=$(basename "$f")
            case "$n" in *.pyd) n="${n%.pyd}.dll" ;; esac
            [ -z "${from[$n]:-}" ] || { echo "::error::two files to sign named $n"; exit 1; }
            from[$n]="$f"
            cp "$f" "$in/$n"
          done < "$RUNNER_TEMP/to_sign.txt"
          echo "${#from[@]} files to sign"
          export CODE_SIGN_TOOL_PATH="$RUNNER_TEMP/cst"
          java="${JAVA_HOME_17_X64:-$JAVA_HOME}/bin/java"
          cst() { (cd "$CODE_SIGN_TOOL_PATH" && "$java" -jar jar/code_sign_tool-*.jar "$@" -username="$ES_USERNAME" \
            -password="$ES_PASSWORD" -credential_id="$ES_CREDENTIAL_ID" 2>&1) || true; }
          # the account's malware blocker: where it is on, eSigner signs a batch only of files scan_code has passed —
          #   each scanned first, and one it calls malware, or a scan that does not answer, stops the run unsigned
          scan=$(cst get_scan_settings)
          if grep -qiE "malware scan settings enabled: *true" <<< "$scan"; then
            for n in "${!from[@]}"; do
              said=$(cst scan_code -input_file_path="$in/$n")
              if grep -q "is not a malware" <<< "$said"; then echo "scanned: $n"
              else echo "::error::$n did not pass eSigner's malware scan:"; head -3 <<< "$said"; exit 1; fi
            done
          elif grep -qiE "malware scan settings enabled: *false" <<< "$scan"; then
            echo "the account's malware blocker is off: nothing to scan"
          else
            echo "::error::the account did not say whether its malware blocker is on:"; head -3 <<< "$scan"; exit 1
          fi
          (cd "$CODE_SIGN_TOOL_PATH" && "$java" -jar jar/code_sign_tool-*.jar batch_sign -username="$ES_USERNAME" \
            -password="$ES_PASSWORD" -credential_id="$ES_CREDENTIAL_ID" -totp_secret="$ES_TOTP_SECRET" \
            -input_dir_path="$in" -output_dir_path="$out")
          # each one back where it came from, signed: one CodeSignTool did not write, or wrote unchanged, stops the run
          for n in "${!from[@]}"; do
            if [ ! -s "$out/$n" ] || cmp -s "$in/$n" "$out/$n"; then echo "::error::$n was not signed"; exit 1; fi
            cp "$out/$n" "${from[$n]}"
          done
      - name: The release's manifest
        run: |
          python3 scripts/sign_plan.py manifest built "$RUNNER_TEMP/plan.json" "${GITHUB_REF#refs/tags/}" built/signed_manifest.json
          ls -l built/evaluator-*/ built/families/lib/ built/families/lib/silicon_families/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: |
            built/evaluator-*/
            built/families/
            built/signed_manifest.json
          if-no-files-found: error

  # the portable app's Windows part (NN-162): SiLVANN\windows\ — SiLVANN.exe, Python's embeddable build with the runtime's
  #   packages, the evaluator for it, the families, the release's tree — built by scripts/portable/build_portable.ps1;
  #   `portable_app` joins it with Linux's into the one archive a release carries
  portable:
    needs: [evaluator, families, sign]
    if: ${{ !cancelled() && !failure() }}   # on a release candidate's branch `sign` is skipped, and the files are unsigned
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: startsWith(github.ref, 'refs/tags/rel')
        with:
          name: signed
          path: built
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ !startsWith(github.ref, 'refs/tags/rel') }}
        with:
          path: built
      - name: Each signature, as Windows reads it
        if: startsWith(github.ref, 'refs/tags/rel')
        shell: pwsh
        run: |
          $files = @(Get-ChildItem built -Recurse -Include "*.pyd", "*.dll", "*.exe")
          if (-not $files) { throw "nothing signed under built\" }
          $bad = @()
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f.FullName
            "{0}: {1}, {2}; timestamped by {3}" -f $f.Name, $s.Status, $s.SignerCertificate.Subject, $s.TimeStamperCertificate.Subject
            if ($s.Status -ne "Valid" -or -not $s.TimeStamperCertificate) { $bad += $f.Name }
          }
          if ($bad) { throw "not signed and timestamped as Windows checks it: $($bad -join ', ')" }
      - name: The portable app's folder
        shell: pwsh
        run: pwsh scripts/portable/build_portable.ps1 -Lib built -Out portable -Launcher built/families/lib/SiLVANN.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: silvann_portable_windows_part
          path: portable/silvann_portable_windows_part.zip
          if-no-files-found: error

  # the portable app's Linux part (NN-194): SiLVANN/linux/ — SiLVANN.sh, a standalone Python with the runtime's packages,
  #   the evaluator for it, the families, the release's tree — built by scripts/portable/build_portable.sh in a
  #   manylinux_2_28 container (AlmaLinux 8, glibc 2.28), so it runs on the Linux systems from RHEL 8, Debian 10 and
  #   Ubuntu 20.04 on. Its families: the CPU's, OpenCL's four (which open the OpenCL a GPU's driver installs) and NVIDIA's
  #   (CUDA 12.9 for every card the family lists, its runtime linked in: a driver of CUDA 12's line is all it needs).
  #   ROCm's are not in it — each opens the ROCm a system installed, at the version it was built with — so an AMD card
  #   takes OpenCL 2.0 there; install.sh and the AMD image build ROCm's. Linux checks no signature: nothing is signed.
  linux_portable:
    runs-on: ubuntu-24.04
    # quay.io/pypa/manylinux_2_28_x86_64:2026.11.01-2
    container: quay.io/pypa/manylinux_2_28_x86_64@sha256:7e41b1c7fd64dfc69703a1124b43c404382973ee06ec5d764b85c34d2221fded
    env:
      SILVANN_SILICON_FAMILIES: "x86_avx2 khronos_opencl2 intel_opencl2 nvidia_opencl1 intel_opencl1_igpu nvidia_cuda12"
      SILVANN_NVCC: /usr/local/cuda-12.9/bin/nvcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CUDA 12.9's compiler and runtime, from NVIDIA's repository for RHEL 8
        run: |
          curl -fsSL -o /etc/yum.repos.d/cuda-rhel8.repo \
            https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo
          dnf install -y cuda-nvcc-12-9 cuda-cudart-devel-12-9
      - name: The portable app's Linux part
        run: bash scripts/portable/build_portable.sh --out portable
      - name: Every family built, and none needing more than glibc 2.28
        run: |
          cd portable/SiLVANN/linux/lib
          for f in $SILVANN_SILICON_FAMILIES; do
            test -f silicon_families/libsilvann_$f.so || { echo "no $f"; exit 1; }
          done
          for f in silvann_engine_cpu*.so silicon_families/*.so; do
            minor=$(objdump -T "$f" | grep -oE 'GLIBC_2\.[0-9]+' | cut -d. -f2 | sort -n | tail -1)
            echo "$f: GLIBC_2.$minor"
            [ "$minor" -le 28 ] || { echo "$f needs glibc 2.$minor"; exit 1; }
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: silvann_portable_linux_part
          path: portable/silvann_portable_linux_part.tar.gz
          if-no-files-found: error

  # the portable app (NN-194): one archive, silvann_portable_x64.zip — SiLVANN/windows/, SiLVANN/linux/ and SiLVANN/data/,
  #   one folder a USB drive carries between the two systems — by scripts/portable/pack_portable.py, attached to the tag's
  #   release
  portable_app:
    needs: [portable, linux_portable]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: silvann_portable_windows_part
          path: parts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: silvann_portable_linux_part
          path: parts
      - name: The two parts, one archive
        run: |
          python3 scripts/portable/pack_portable.py parts/silvann_portable_windows_part.zip \
            parts/silvann_portable_linux_part.tar.gz silvann_portable_x64.zip
          ls -l silvann_portable_x64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: silvann_portable_x64
          path: silvann_portable_x64.zip
          if-no-files-found: error
      - name: Attached to the tag's release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --verify-tag --title "SiLVANN $tag" \
            --notes "SiLVANN $tag." || gh release view "$tag" > /dev/null
          gh release upload "$tag" silvann_portable_x64.zip --clobber

  zip:
    needs: [evaluator, families, sign]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: startsWith(github.ref, 'refs/tags/rel')
        with:
          name: signed
          path: built
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ !startsWith(github.ref, 'refs/tags/rel') }}
        with:
          path: built
      - name: The zip, stamped with what it was built from
        run: |
          mkdir -p out/lib/silicon_families out/lib/notices
          cp built/evaluator-*/silvann_engine_cpu*.pyd out/lib/
          cp built/families/lib/silicon_families/*.dll out/lib/silicon_families/
          cp built/families/notices/* out/lib/notices/
          printf 'engine %s\nbuild.py %s\ncommit %s\n' "$(git rev-parse HEAD:engine)" "$(git rev-parse HEAD:scripts/build.py)" \
            "$GITHUB_SHA" > out/lib/windows_libraries.txt
          cat > out/lib/NOTICES.md <<EOF
          # SiLVANN's prebuilt Windows libraries — what they hold

          Built by \`.github/workflows/windows-libraries.yml\` from commit $GITHUB_SHA of
          https://github.com/$GITHUB_REPOSITORY, which is their corresponding source (\`windows_libraries.txt\` names it).

          | part | licence | its notice |
          |---|---|---|
          | SiLVANN: the evaluator (\`silvann_engine_cpu.*.pyd\`) and the silicon families (\`silicon_families/*.dll\`) | AGPL-3.0 with the additional permission in ATTRIBUTION.md §1 | the release's \`LICENSE\` and \`ATTRIBUTION.md\` |
          | NVIDIA's CUDA runtime, linked statically into \`libsilvann_nvidia_cuda12.dll\` | NVIDIA CUDA Toolkit EULA (a redistributable component) | \`notices/CUDA_EULA.txt\`, \`notices/CUDA_VERSION.txt\` |
          | pybind11, compiled into the evaluator | BSD-3-Clause | \`notices/PYBIND11_LICENSE.txt\` |
          | LLVM's compiler-rt builtins, linked into each library | Apache-2.0 WITH LLVM-exception | ATTRIBUTION.md §7 |
          EOF
          if [ -f out/lib/silicon_families/libsilvann_amd_rocm10.dll ]; then
            echo "| AMD's HIP, its headers compiled into \`libsilvann_amd_rocm10.dll\` — which asks for AMD's own runtime, \`amdhip64_7.dll\`, and holds none of it | MIT | \`notices/HIP_LICENSE.txt\`, \`notices/HIP_VERSION.txt\` |" >> out/lib/NOTICES.md
          fi
          (cd out && zip -qr ../silvann_windows_libraries_update_x64.zip lib)
          unzip -l silvann_windows_libraries_update_x64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: silvann_windows_libraries_update_x64
          path: silvann_windows_libraries_update_x64.zip
      - name: Attached to the tag's release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --verify-tag --title "SiLVANN $tag" \
            --notes "SiLVANN $tag. silvann_windows_libraries_update_x64.zip holds the Windows libraries install.ps1 takes."
          gh release upload "$tag" silvann_windows_libraries_update_x64.zip --clobber

  # the release's manifest, attached last: the next release reuses this one's signed files only once both zips are on it
  #   (SiLVANN.exe from silvann_portable_x64.zip, the libraries from silvann_windows_libraries_update_x64.zip)
  manifest:
    needs: [sign, portable_app, zip]
    if: startsWith(github.ref, 'refs/tags/rel')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: built
      - name: Attached to the tag's release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF#refs/tags/}" built/signed_manifest.json --clobber --repo "$GITHUB_REPOSITORY"
