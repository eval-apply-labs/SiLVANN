# The Contributor License Agreement, asked once per contributor on their first pull request.
# A contributor accepts by replying with the sentence below; the signature is stored in this repository,
# on the `cla-signatures` branch, in signatures/version1/cla.json. CLA.md is the agreement.
# The action is pinned to the commit of its v2.6.1 release, because it runs with write access on
# pull requests opened by anyone.
name: "CLA"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: "Contributor License Agreement"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/eval-apply-labs/SiLVANN/blob/main/CLA.md"
          branch: "cla-signatures"
          allowlist: "dependabot[bot],github-actions[bot]"
