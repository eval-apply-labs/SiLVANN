# main's Docker image, the nightly: built on every push to main, and published to GHCR as
# ghcr.io/eval-apply-labs/silvann:main. Until v1.0 it is the one image published. From v1.0 each major version's branch
# (release/v1, …) gets a file like this one, building its tag (:1, …) on every push to it: its minor and patch releases
# replace that tag in place, and an update within it keeps the models and the conversations working.
#
# It publishes only when the repository variable SILVANN_PUBLISH_IMAGE is `yes` (Settings -> Secrets and variables ->
# Actions -> Variables). Until then each push builds the image and discards it, so a build that breaks is seen before
# anything is published. The image holds binaries (IMAGE_NOTICES.md in it says which, and each one's licence).
#
# The runners have no GPU: this builds the image and runs no model. The actions are pinned to their release commits,
# because the job can write to the repository's packages.
name: "image: main"
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-main
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: vars.SILVANN_PUBLISH_IMAGE == 'yes'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, and publish when it is switched on
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            SILVANN_SOURCE=https://github.com/${{ github.repository }}
            SILVANN_REF=main
            SILVANN_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ghcr.io/eval-apply-labs/silvann:main
          push: ${{ vars.SILVANN_PUBLISH_IMAGE == 'yes' }}
