<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="t d">
<title id="t">What each model needs</title>
<desc id="d">Each pack's download, set against what models.md says it needs. Qwen 3.5 2B D4: 1.7 GB; for a phone; 2.5 GB at the load's peak. Qwen 3.5 4B D4: 3.5 GB; for the CPU alone and small cards. Qwen 3.5 4B D8: 5.3 GB; see its section. Ministral 3 14B D4: 7.4 GB; for 8 GB cards. Ministral 3 14B D8: 13.5 GB; for 16 GB cards. Qwen 3.8 27B D4: 15 GB; see its section. Qwen 3.6 35B-A3B D8E4: 19 GB; see its section. Qwen 3.5 122B-A10B D8E4: 67 GB; for 8 GB cards; its experts 54 GB. Qwen 3.8 Flash-Next D8E4: 111 GB; a 16 GB card, 32 GB of RAM and a fast NVMe drive; its experts 57 GB; 48 GB of the download read from the disk. GLM 5.3 Flash D8E4: 166 GB; on the CPU alone, 30 GB of RAM its least. DeepSeek-V4.1-Flash-1017 D8E4: 492 GB; its experts 272 GB; 203 GB of the download read from the disk. Qwen-Image 2.1 D8: 18 GB; see users.md.</desc>
